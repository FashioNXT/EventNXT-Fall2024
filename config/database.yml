default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # Using your Mac username to ensure the connection is authorized
  username: <%= ENV.fetch("POSTGRES_USER") { 'titochowdhury' } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { nil } %>
  host: localhost
  port: 5432

development:
  <<: *default
  database: eventnxt_development

test:
  <<: *default
  database: eventnxt_test

production:
  url: <%= ENV['DATABASE_URL'] %>
